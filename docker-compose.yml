name: telegraf-timescaledb-graphana

services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg17
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  telegraf:
    build: ./infra/telegraf
    env_file: .env
    environment:
      TELEGRAF_PGPASSWORD: ${TELEGRAF_PGPASSWORD}
      PYTHONPATH: /app/src:/app
      # The exec input runs with CWD=/; point STREAM_STATE_DIR at the
      # mounted volume's absolute in-container path (host ./state).
      STREAM_STATE_DIR: /app/state
    volumes:
      - ./state:/app/state
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
    depends_on:
      timescaledb:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescale_data: