# Telegraf configuration — live ward vitals feed.
#
# Topology: stream_vitals.py -> inputs.exec -> outputs.postgresql -> TimescaleDB
#   - stream_vitals.py advances each patient's simulation one scenario tick per
#     run, prints one Influx line-protocol line per emitted vitals event, and
#     persists a per-patient checkpoint so runs are resumable and idempotent.
#   - inputs.exec parses the lines (data_format = "influx").
#   - outputs.postgresql maps tags -> columns and fields -> columns of the
#     `vitals` hypertable. The schema is owned by sql/ddl/00_init.sql, so this
#     plugin is deliberately configured to never mutate the schema:
#       create_templates = []   (never try to create tables)
#       add_column_templates = [] (never ALTER; skip mis-shaped points)

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  logtarget = "stderr"

[[inputs.exec]]
  commands = ["python3 /app/scripts/stream_vitals.py"]
  interval = "10s"
  timeout = "8s"
  data_format = "influx"

[[outputs.postgresql]]
  connection = "host=timescaledb user=postgres password=${TELEGRAF_PGPASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
  schema = "public"
  timestamp_column_type = "timestamp with time zone"
  create_templates = []
  add_column_templates = []